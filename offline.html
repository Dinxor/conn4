<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2c3e50" />
  <title>Connect 4 — офлайн</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #1a2a3a, #0d1a2a);
      color: #fff;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: rgba(44, 62, 80, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 20px 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 10px; font-size: 20px; }
    p { margin: 0 0 16px; opacity: 0.9; line-height: 1.5; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    a, button {
      appearance: none;
      border: 0;
      background: #e67e22;
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    a.secondary {
      background: #34495e;
    }
    .tip {
      margin-top: 14px;
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Офлайн режим</h1>
    <p>Нет подключения к сети. Приложение может работать в офлайн-режиме, если уже было открыто онлайн и кэшировано.</p>
    <div class="row">
      <a href="/conn4/">▶️ Открыть игру</a>
      <a class="secondary" href="/conn4/index.html">🔄 Перезагрузить</a>
    </div>
    <div class="tip">Подсказка: для офлайн-работы нужен установленный Service Worker и закэшированный app-shell.</div>
  </div>
</body>
</html>
